<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Palace of the Silver Princess — Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:,">
<link rel="stylesheet" href="styles.css" />
</head>
<body class="player">
<header class="topbar">
  <h1 id="mapName">&#128506; Palace of the Silver Princess</h1>
  <span class="badge" id="syncStatus">Sync: local only</span>
  <div style="flex:1"></div>
  <button id="fitBtn">Fit</button>
  <button id="fullscreenBtn">&#9974; Fullscreen</button>
</header>
<div class="layout">
  <div class="stage-wrap" id="stageWrap" style="cursor:grab">
    <div class="zoom-controls">
      <button id="zoomIn">+</button>
      <button id="zoomOut">&minus;</button>
    </div>
  </div>
</div>
<script>
  // Enables live cross-device sync when served over http(s) — see
  // sync-server/README.md. Harmless no-op for file:// / offline use.
  if (location.protocol !== "file:") {
    window.DND_SYNC_WS_URL = (location.protocol === "https:" ? "wss://" : "ws://") + location.hostname + ":8181";
  }
</script>
<script src="data.js"></script>
<script src="fog-engine.js"></script>
<script src="app-player.js"></script>
</body>
</html>
